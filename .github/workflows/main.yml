
name: Build Python Wheels

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:

  # ============================================================
  # LINUX BUILDS — manylinux (recommended)
  # ============================================================
  linux:
    runs-on: ubuntu-latest

    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x ci/build_linux.sh

      - name: Build wheels (manylinux)
        run: ./ci/build_linux.sh

      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*
          retention-days: 1

  # ============================================================
  # WINDOWS BUILDS — run your script directly
  # ============================================================
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 🛠️ Run your Windows build script (includes all setup)
      # --------------------------------------------------------
      - name: Run Windows build script
        run: ci\build_windows.bat
        shell: cmd

      # --------------------------------------------------------
      # 📦 Upload built wheels
      # --------------------------------------------------------
      - name: Upload Windows wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*
          retention-days: 1

  # ============================================================
  # MACOS BUILDS — universal2 wheels (Intel + Apple Silicon)
  # ============================================================
  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x ci/build_macos.sh

      - name: Build wheels (macOS)
        run: ./ci/build_macos.sh

      - name: Upload macOS wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: wheelhouse/*
          retention-days: 1

  # ============================================================
  # COMBINE WHEELS — merge Linux, Windows, and macOS outputs
  # ============================================================
  combine-wheels:
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    
    steps:
      - name: Download Linux wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux
          path: combined-wheels/

      - name: Download Windows wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: combined-wheels/

      - name: Download macOS wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-macos
          path: combined-wheels/

      - name: Upload combined wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-combined
          path: combined-wheels/*
          retention-days: 30
