# Mann Turbulence Generation Configuration File This file defines the parameters
# for generating synthetic turbulence fields using the Mann model.

# This example embeds the image of Mona Lisa into the y-z plane of a turbulent
# wind field in the form of velocity constraints -because even turbulence
# deserves a touch of classical art.

# Note: Some parameters in this file are commented out because they are optional
# and have default values. You can override these defaults by uncommenting and
# modifying the corresponding lines.


[stencil_params]
L = 30.0    # Length scale (m), characterizes the size of energy-containing eddies
gamma = 3.9 # Anisotropy parameter, controls the elongation of turbulence structures
Lx = 1000.0 # Domain length in x-direction (m)
Ly = 1000.0 # Domain length in y-direction (m)
Lz = 1000.0 # Domain length in z-direction (m)
Nx = 128    # Number of grid points in x-direction
Ny = 64     # Number of grid points in y-direction
Nz = 64     # Number of grid points in z-direction

# Periodicity settings:
# These flags determine whether the turbulence box is periodic in each spatial direction.
# Setting a direction to periodic (false) can reduce computational cost by approximately half.
# If omitted, lateral (y) and vertical (z) axes are set to to aperiodic.
# aperiodic_x = false
# aperiodic_y = true
# aperiodic_z = true

# sinc_thres = 3.0 # Threshold for applying the Mann sinc correction to low-frequency modes (default = 3.0)
# In case of numerical instabilities when generating constrained turbulence, try increasing this value.

# Turbulence boxes:
# Each entry defines a separate turbulence realization with its own spectral scaling and seed.
# You can add as many turbulence boxes as needed to generate multiple outputs from the same stencil.
[[turbulence_boxes]]
ae = 0.05                 # Spectral scaling factor (αε^{2/3}), controls the amplitude of the turbulence spectrum
seed = 42                 # Random seed for reproducibility
output = "mona_lisa.nc" # Output file name for the generated turbulence field
# format = "netCDF"   # Output format: 'netCDF' or 'HAWC2' (default = 'netCDF')


# Constraint settings:
# Providing constraint_params will generate a constrained turbulence box.
# You may specify any number of velocity constraints to enforce specific values at grid points.
[constraint_params]
spectral_compression_target = 0.9 # Desired compression ratio for the constraint impulse response (default = 0.8)
# corr_thres = 0.0001               # Threshold for sparsifying the constraint correlation matrix (default = 0.0001)
